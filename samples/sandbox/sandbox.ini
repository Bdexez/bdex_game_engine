# Sandbox configuration. Every key can be overridden on the command line:
#   ./sandbox --set window.width=1920 --set renderer.vsync=false

[engine]
# Modules loaded at startup, in any order: the engine sorts them by their
# declared dependencies. Swap an entry to change backend, e.g.
#   window_null  instead of window_glfw  -> no window (same as --headless)
#   rhi_null     instead of rhi_vulkan   -> no GPU at all
modules = window_glfw, rhi_vulkan, renderer_forward

[window]
title = bdex sandbox
width = 1280
height = 720

[renderer]
vsync = true

[rhi]
# Khronos validation layer. Defaults to on in debug builds, off otherwise.
# validation = true
